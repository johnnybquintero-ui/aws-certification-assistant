name: Automated tests

# Run this workflow whenever code is pushed to GitHub.
on:
  push:

# Give the workflow only the permission it requires.
permissions:
  contents: read

jobs:
  test:
    # GitHub creates a temporary Ubuntu computer for this job.
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      # Download the repository onto the temporary computer.
      - name: Check out repository
        uses: actions/checkout@v7

      # Install the same Python version used by the project.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements_dev.txt

      # requirements_dev.txt also installs everything from requirements.txt.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_dev.txt

      # Run exactly the same test command used locally.
      - name: Run tests
        run: python -m pytest -v